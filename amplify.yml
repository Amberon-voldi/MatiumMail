# AWS Amplify Hosting build for Matium Mail (Next.js 16, SSR).
#
# Set these in Amplify console → Hosting → Environment variables (mark the
# secret ones as secret), with the SAME values as your local .env —
# CREDENTIAL_KEYS in particular, because both use one database:
#   APP_URL (https://…), DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME,
#   DB_TLS=pinned, DB_TLS_CA_PEM_BASE64, CREDENTIAL_KEYS, CREDENTIAL_ACTIVE_KEY_ID
#   optional: DB_CONNECTION_LIMIT, SESSION_IDLE_HOURS, SESSION_ABSOLUTE_DAYS
#
# Amplify only exposes them during the build; scripts/write-env-production.mjs
# copies them into .env.production so the Next.js server can read them at runtime.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - node scripts/write-env-production.mjs
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
