# Local test infrastructure ONLY. Nothing here is used by the running app.
#   npm run dev:infra        start
#   npm run dev:infra:down   stop
#
# The app (dev and production) uses the MilesWeb MariaDB over pinned TLS —
# there is deliberately no local database.
#
# greenmail — throwaway IMAP/SMTP server for the automated IMAP integration
#             tests (src/server/mail/*.integration.test.ts). Test account
#             dev@dev.local / devpass. Its implicit-TLS ports use a
#             self-signed certificate, which the app accepts ONLY for
#             localhost hosts outside production.
services:
  greenmail:
    image: greenmail/standalone:2.1.5
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=dev:devpass@dev.local
        -Dgreenmail.users.login=email
    ports:
      - "127.0.0.1:3025:3025" # SMTP (plain, tests only)
      - "127.0.0.1:3465:3465" # SMTPS
      - "127.0.0.1:3143:3143" # IMAP (plain, tests only)
      - "127.0.0.1:3993:3993" # IMAPS
